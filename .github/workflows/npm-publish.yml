name: Publish to npm

# Push a tag `vX.Y.Z` matching package.json to publish. Pre-release versions
# (`X.Y.Z-beta.N`) go to the `next` dist-tag. Needs the NPM_TOKEN secret.
# The EmDash registry release is separate (`pnpm run release:setup`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: pnpm run validate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
